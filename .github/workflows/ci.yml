name: CI

# Keep the workflow named "CI" and the job named "test": the merge workflow and the
# required status check on main both depend on those names.
#
# If you add a deploy job: merges made by the merge workflow don't start `push` runs, so a job
# gated on github.event_name == 'push' never runs for them. After each merge the merge workflow
# starts this workflow with workflow_dispatch instead; include that event in the deploy job's
# if: when every merge should deploy (for example to staging).

on:
  pull_request:
  push:
    branches: [main, "milestone/**"]
  # The merge workflow starts this on the milestone branch after each merge,
  # so the combined code of all merged pull requests is tested.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

